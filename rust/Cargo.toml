[workspace]
resolver = "2"
members = ["core", "wasm", "android", "kg"]

[workspace.package]
version = "2.19.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.jade-wasm]
opt-level = "s"

[profile.release.package.jade-kg]
opt-level = 3
