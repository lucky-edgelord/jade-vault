name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    # Playwright 1.56 has no Chromium for Ubuntu 26.04 (ubuntu-latest since late October 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pip install -r jade-discord/requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build web app
        run: npm run build
      - name: Tests
        run: npm test
      - name: Knowledge engine (Rust)
        run: cargo test --manifest-path rust/Cargo.toml -p jade-kg --release
      - name: Build APK (debug key)
        run: bash android/build-apk.sh
      - name: Bridge checks
        run: |
          python3 -m py_compile jade-vector/*.py jade-vector/test/*.py jade-discord/*.py jade-discord/test/*.py
          bash -n jade-vector/setup.sh
          bash -n jade-discord/setup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-vault-build
          path: |
            dist/
            tests/.work/**/*.png
          if-no-files-found: ignore

  vector-agent:
    # Compiles Vector's vector-agent with the Jade patch, so a Vector change that breaks the patch shows up here.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: jade-vector
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
